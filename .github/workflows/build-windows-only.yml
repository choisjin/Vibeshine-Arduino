---
name: Build Windows Only
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - vibe
    paths:
      - 'src/**'
      - 'cmake/**'

jobs:
  build_windows:
    name: Windows AMD64
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Init submodules
        shell: bash
        run: git submodule update --init --recursive

      - name: Create SudoVDA dummy files
        shell: bash
        run: |
          mkdir -p src_assets/windows/drivers/sudovda
          echo "dummy" > src_assets/windows/drivers/sudovda/install.ps1
          echo "dummy" > src_assets/windows/drivers/sudovda/uninstall.bat
          echo "dummy" > src_assets/windows/drivers/sudovda/SudoVDA.inf
          echo "dummy" > src_assets/windows/drivers/sudovda/SudoVDA.dll
          echo "dummy" > src_assets/windows/drivers/sudovda/sudovda.cat
          echo "dummy" > src_assets/windows/drivers/sudovda/sudovda.cer
          echo "dummy" > src_assets/windows/drivers/sudovda/nefconc.exe

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            wget

      - name: Install dependencies
        run: |
          TOOLCHAIN="ucrt-x86_64"
          pacman -Syu --noconfirm \
            git \
            mingw-w64-${TOOLCHAIN}-boost \
            mingw-w64-${TOOLCHAIN}-cmake \
            mingw-w64-${TOOLCHAIN}-cppwinrt \
            mingw-w64-${TOOLCHAIN}-curl-winssl \
            mingw-w64-${TOOLCHAIN}-gcc \
            mingw-w64-${TOOLCHAIN}-miniupnpc \
            mingw-w64-${TOOLCHAIN}-nlohmann-json \
            mingw-w64-${TOOLCHAIN}-onevpl \
            mingw-w64-${TOOLCHAIN}-openssl \
            mingw-w64-${TOOLCHAIN}-opus \
            mingw-w64-${TOOLCHAIN}-toolchain \
            mingw-w64-${TOOLCHAIN}-MinHook \
            mingw-w64-${TOOLCHAIN}-nodejs \
            mingw-w64-${TOOLCHAIN}-ninja

      - name: Build
        run: |
          mkdir -p build
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF \
            -DCUDA_FAIL_ON_MISSING=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUNSHINE_ASSETS_DIR=assets
          ninja -C build

      - name: Package portable
        shell: pwsh
        run: |
          cpack -G ZIP --config ./build/CPackConfig.cmake

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Vibeshine-Arduino-Windows
          path: build/cpack_artifacts/Sunshine.zip
